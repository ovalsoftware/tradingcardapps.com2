<section id="contact">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 col-lg-offset-2 text-center">
                <h2 class="section-heading">Say hello.</h2>
                <hr class="primary">
                <p>Questions, feedback, partnership ideas, or just want to talk cards? We'd love to hear from you.</p>
            </div>
        </div>
        <div class="row contact-row">
            <div class="col-md-6 text-center">
                <a href="{{ site.app_url }}" target="_blank" rel="noopener" class="contact-item">
                    <i class="fa fa-mobile fa-3x wow bounceIn"></i>
                    <p class="contact-label">The App</p>
                    <p class="contact-value">tcgcompanion.app</p>
                </a>
            </div>
            <div class="col-md-6 text-center">
                <a href="mailto:{{ site.email }}" class="contact-item">
                    <i class="fa fa-envelope-o fa-3x wow bounceIn" data-wow-delay=".1s"></i>
                    <p class="contact-label">Email</p>
                    <p class="contact-value">{{ site.email }}</p>
                </a>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12 text-center site-footer">
                <p>&copy; {{ 'now' | date: "%Y" }} Trading Card App Ltd · <a href="{{ site.app_url }}" target="_blank" rel="noopener">tcgcompanion.app</a></p>
            </div>
        </div>
    </div>
</section>
